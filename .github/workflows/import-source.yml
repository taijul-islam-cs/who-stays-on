name: Import project files
on:
  push:
    branches: [main]
    paths:
      - who-stays-on-upload-payload.zip
      - .github/workflows/import-source.yml
permissions:
  contents: write
jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path('who-stays-on-upload-payload.zip')
          with ZipFile(archive) as files:
              for name in files.namelist():
                  path = Path(name)
                  if path.is_absolute() or '..' in path.parts:
                      raise ValueError(f'Unsafe archive path: {name}')
              files.extractall('.')
          archive.unlink()
          PY
      - name: Commit project tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm --ignore-unmatch .github/workflows/import-source.yml
          git commit -m 'Add complete Who Stays On project source'
          git push origin HEAD:main
